# Builds the runtime on each platform against its dependency bundle, tests it and archives the
# installation (docs/releasing.md).
#
# - On a pull request to main: builds and tests every platform, checks that each archive needs only
#   the system's libraries and its own, and keeps the archives as workflow artifacts for 7 days.
# - Run manually (Actions > Build > Run workflow, or gh workflow run build.yml --ref <branch>): the
#   same, for the chosen branch. With the input publish, which only main accepts, it then creates a
#   draft release v<version> with the archives and their checksums; an administrator publishes it.
#
# Each build job fetches the dependency bundle of its key, which cmake/PraenoraRuntimeDepsPin.cmake
# pins, with cmake/praenora_fetch_runtime_deps.cmake, and runs the CI presets ci-<key> of
# CMakePresets.json (docs/developer-guide.md#ci-presets). A bundle is built with the compiler of
# the runner image of praenora-runtime-deps' workflow, and the runtime must be built with that
# compiler or a newer one of the same family, so the runner labels are those of that workflow,
# fixed versions, never -latest.
#
# The test ci.workflow_consistency (tests/ci/check_workflow_consistency.cmake) reads this file as
# text, line by line, and relies on this format: each matrix entry is a line "- key: <key>"
# followed by a line "runner: <label>"; the keys are the platforms of
# PRAENORA_RUNTIME_DEPS_PLATFORMS in the pin file, each with its presets ci-<key>; each runner
# label is ubuntu-24.04, macos-26 or windows-2022, the one of its key's operating system, and each
# runs-on value is one of these labels or the matrix's runner; each action is used on a line
# "uses: <owner>/<name>@<commit of 40 hexadecimal digits> # v<version>". Each of these values is
# on the line of its key, unquoted and without a comment (but the version comment of uses:); the
# test refuses a key whose value is on the lines after it.

name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Create a draft release v<version> with the archives (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      deps-version: ${{ steps.deps.outputs.version }}
      deps-repository: ${{ steps.deps.outputs.repository }}
    env:
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the runtime's version
        id: version
        run: |
          n='[0-9][0-9]*'
          version=$(sed -n "s/^project(praenora_runtime VERSION \($n\.$n\.$n\) .*/\1/p" \
              CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "::error::No project(praenora_runtime VERSION ...) found in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Runtime version $version"
      - name: Read the pin of the dependency bundles
        id: deps
        run: |
          pin=cmake/PraenoraRuntimeDepsPin.cmake
          version=$(sed -n 's/^set(PRAENORA_RUNTIME_DEPS_VERSION "\([0-9.]*\)")$/\1/p' "$pin")
          repository=$(sed -n 's/^set(PRAENORA_RUNTIME_DEPS_REPOSITORY "\([^"]*\)")$/\1/p' \
              "$pin")
          if [ -z "$version" ] || [ -z "$repository" ]; then
            echo "::error::No PRAENORA_RUNTIME_DEPS_VERSION or _REPOSITORY found in $pin"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "Dependency bundles $version of $repository"
      - name: Check that a release can be made
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are made from main only, not from $GITHUB_REF"
            exit 1
          fi
          # git ls-remote --exit-code exits with 2 when no ref matches. The checkout keeps no
          # credentials, so this needs a public repository, as this one is (docs/releasing.md).
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::The tag v$VERSION exists already; raise project(VERSION) in" \
                "CMakeLists.txt (docs/releasing.md)"
            exit 1
          elif [ "$status" -ne 2 ]; then
            echo "::error::git ls-remote could not list the tags of origin (exit code $status)" \
                "without credentials, which needs a public repository (docs/releasing.md)"
            exit 1
          fi

  build:
    name: ${{ matrix.key }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64-release
            runner: ubuntu-24.04
          - key: macos-arm64-release
            runner: macos-26
          - key: windows-x64-release
            runner: windows-2022
          - key: windows-x64-debug
            runner: windows-2022
    steps:
      # Without line-ending conversion, the working tree holds the committed bytes, with the LF
      # line endings of .gitattributes, which the golden files and other tests compare.
      - name: Configure Git (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Python bindings are built for this interpreter (Python3_EXECUTABLE), which brings its
      # headers and, on Windows, its import library.
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Ninja and SWIG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build swig
      - name: Install Ninja and SWIG (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ninja || brew install ninja
          command -v swig || brew install swig
      # The Windows presets use the Visual Studio 2022 generator, which finds MSVC itself: neither
      # Ninja nor the developer environment is needed.
      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        run: choco install swig -y --no-progress
      # The script checks the archive against its pinned SHA-256, unpacks it and appends
      # PRAENORA_RUNTIME_DEPS=<bundle> to GITHUB_ENV, which the CI presets read.
      - name: Fetch the dependency bundle
        run: >-
          cmake "-DPLATFORM=${{ matrix.key }}" "-DDESTINATION=${{ runner.temp }}/deps"
          -P cmake/praenora_fetch_runtime_deps.cmake
      - name: Show the tools
        shell: bash
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          cmake --version
          swig -version
          "$PYTHON" --version
          echo "PRAENORA_RUNTIME_DEPS=$PRAENORA_RUNTIME_DEPS"
      # No step shortens the checkout's path on Windows, as praenora-runtime-deps' workflow does
      # with subst for its object files. In the checkout D:\a\praenora-runtime\praenora-runtime
      # (39 characters with its last \), the longest path of a windows-x64-release job is
      # estimated at 235 characters, below the limit of 259: a license file in CPack's staging
      # directory, build\ci-windows-x64-release\package\_CPack_Packages\win64\ZIP\<archive name>\
      # share\praenora\licenses\libroadrunner-deps\third_party\NuML\libnuml\LICENSE.txt. The
      # longest object file path, which cl limits, is estimated at 172 (docs/releasing.md).
      - name: Configure
        run: >-
          cmake --preset ci-${{ matrix.key }}
          "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"
      # --parallel makes MSBuild build projects side by side (/m); Ninja builds in parallel anyway.
      - name: Build
        run: cmake --build --preset ci-${{ matrix.key }} --parallel
      - name: Test
        run: ctest --preset ci-${{ matrix.key }}
      # The Visual Studio generator names the target PACKAGE, and passes the build preset's
      # configuration to cpack (docs/developer-guide.md#archiving-an-installation).
      - name: Archive the installation
        run: >-
          cmake --build --preset "ci-${{ matrix.key }}"
          --target "${{ startsWith(matrix.key, 'windows-') && 'PACKAGE' || 'package' }}"
      # The archive must need only the system's libraries and its own: the CI presets build
      # yaml-cpp, spdlog and GoogleTest from their pinned commits, and the bundle holds static
      # libraries. The step unpacks the archive into the runner's temporary directory and lists the
      # libraries that each program and library of bin/, lib/ (the service providers included) and
      # libexec/ names, with readelf -d (Linux), otool -L (macOS) or dumpbin -dependents
      # (Windows); a library that is neither the system's nor in the archive fails it, named with
      # its file, and the archive is not uploaded (docs/releasing.md#the-workflow).
      - name: Check the archive's libraries
        shell: bash
        env:
          KEY: ${{ matrix.key }}
        run: |
          set -o pipefail
          shopt -s nullglob
          archives=(build/ci-"$KEY"/package/praenora-runtime-*.tar.xz
                    build/ci-"$KEY"/package/praenora-runtime-*.zip)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::build/ci-$KEY/package holds ${#archives[@]} archives, not one"
            exit 1
          fi
          archive="$PWD/${archives[0]}"
          name=$(basename "$archive")
          name=${name%.tar.xz}
          name=${name%.zip}
          work="$RUNNER_TEMP/archive-check"
          if [ "$RUNNER_OS" = Windows ]; then
            work="$(cygpath -u "$RUNNER_TEMP")/archive-check"
            programs=$(cygpath -u "$(printenv 'ProgramFiles(x86)')")
            vswhere="$programs/Microsoft Visual Studio/Installer/vswhere.exe"
            dumpbin=$("$vswhere" -latest -products '*' -version '[17.0,18.0)' \
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
                -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | tr -d '\r' | sed -n 1p)
            if [ -z "$dumpbin" ]; then
              echo "::error::$vswhere found no dumpbin.exe of Visual Studio 2022"
              exit 1
            fi
            dumpbin=$(cygpath -u "$dumpbin")
            system32=$(cygpath -u -S)
          fi
          rm -rf "$work"
          mkdir -p "$work"
          (cd "$work" && cmake -E tar xf "$archive")
          cd "$work/$name"

          # libraries <file>: the libraries that <file> names, one per line.
          libraries() {
            case "$RUNNER_OS" in
              Linux) readelf -d "$1" | sed -n 's/^.*(NEEDED).*\[\(.*\)\]$/\1/p' ;;
              macOS)
                otool -L "$1" | sed -n 's/^[[:space:]]*\(.*\) (compatibility version .*$/\1/p' ;;
              Windows)
                "$dumpbin" -nologo -dependents "$1" | tr -d '\r' \
                    | sed -n 's/^[[:space:]][[:space:]]*\([^[:space:]]*\.[Dd][Ll][Ll]\)$/\1/p' ;;
              *) echo "::error::No check for the runner's operating system, $RUNNER_OS" >&2
                 return 1 ;;
            esac
          }
          # in_archive <name>: whether the archive holds a file or link of that name.
          in_archive() {
            [ -n "$(find . -name "$1" -print)" ]
          }
          # allowed <library>: whether <library> is the system's or in the archive.
          allowed() {
            case "$RUNNER_OS" in
              Linux)
                case "$1" in
                  # glibc's libraries, and GCC's C++ and support libraries.
                  libc.so.6 | libm.so.6 | libdl.so.2 | libpthread.so.0 | librt.so.1) return 0 ;;
                  libutil.so.1 | libresolv.so.2 | ld-linux-x86-64.so.2) return 0 ;;
                  libstdc++.so.6 | libgcc_s.so.1) return 0 ;;
                  */*) return 1 ;;
                  *) in_archive "$1" ;;
                esac ;;
              macOS)
                case "$1" in
                  /usr/lib/* | /System/*) return 0 ;;
                  @rpath/* | @loader_path/* | @executable_path/*) in_archive "${1##*/}" ;;
                  *) return 1 ;;
                esac ;;
              Windows)
                case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
                  # The API sets, and the Visual C++ runtime (with its debug libraries).
                  api-ms-win-* | ext-ms-*) return 0 ;;
                  msvcp140*.dll | vcruntime140*.dll | concrt140*.dll | ucrtbase*.dll) return 0 ;;
                  praenora_runtime.dll) [ -f bin/praenora_runtime.dll ] ;;
                  */* | *\\*) return 1 ;;
                  *) [ -f "$system32/$1" ] ;;
                esac ;;
              *) return 1 ;;
            esac
          }

          dirs=()
          for dir in bin lib libexec; do
            if [ -d "$dir" ]; then dirs+=("$dir"); fi
          done
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::$name holds none of bin/, lib/ and libexec/"
            exit 1
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            files=$(find "${dirs[@]}" -type f \( -iname '*.exe' -o -iname '*.dll' \) | sort)
          else
            files=$(find "${dirs[@]}" -type f \( -path 'bin/*' -o -path 'libexec/*' \
                -o -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) | sort)
          fi
          if [ -z "$files" ]; then
            echo "::error::$name holds no program or library to check"
            exit 1
          fi
          checked=0
          problems=0
          while IFS= read -r file; do
            checked=$((checked + 1))
            if ! names=$(libraries "$file"); then
              echo "::error::$file: its libraries could not be listed"
              problems=$((problems + 1))
              continue
            fi
            # Each program and library names at least the system's C library, so an empty list
            # means that the list was not read.
            if [ -z "$names" ]; then
              echo "::error::$file: no library was listed, so the list was not read"
              problems=$((problems + 1))
              continue
            fi
            echo "$file: $(printf '%s' "$names" | tr '\n' ' ')"
            while IFS= read -r library; do
              if ! allowed "$library"; then
                echo "::error::$file needs $library, which is neither the system's nor in" \
                    "the archive"
                problems=$((problems + 1))
              fi
            done <<< "$names"
          done <<< "$files"
          if [ "$problems" -gt 0 ]; then
            echo "::error::$name: $problems problem(s) in the $checked files checked"
            exit 1
          fi
          echo "$name: $checked files checked, each needs only the system's libraries and the" \
              "archive's own"
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.key }}
          path: |
            build/ci-${{ matrix.key }}/package/*.tar.xz
            build/ci-${{ matrix.key }}/package/*.zip
            build/ci-${{ matrix.key }}/package/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Draft release
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DEPS_VERSION: ${{ needs.prepare.outputs.deps-version }}
      DEPS_REPOSITORY: ${{ needs.prepare.outputs.deps-repository }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Check the archives
        working-directory: dist
        run: |
          shopt -s nullglob
          archives=(praenora-runtime-*.tar.xz praenora-runtime-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::No archives were downloaded"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            case "$archive" in
              "praenora-runtime-$VERSION-"*) ;;
              *) echo "::error::$archive is not of version $VERSION"; exit 1 ;;
            esac
            sha256sum -c "$archive.sha256"
          done
      # The versions come from the Linux archive's own tool, run on this runner, whose image is
      # the one the archive was built on.
      - name: Write the release notes
        run: |
          linux=$(ls dist/praenora-runtime-"$VERSION"-linux-*.tar.xz)
          tar -xJf "$linux" -C "$RUNNER_TEMP"
          praenora="$RUNNER_TEMP/$(basename "$linux" .tar.xz)/bin/praenora"
          "$praenora" version --json > "$RUNNER_TEMP/version.json"
          "$praenora" providers list --json > "$RUNNER_TEMP/providers.json"
          docs="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs"
          deps="$DEPS_REPOSITORY/releases/tag/v$DEPS_VERSION"
          # paragraph <text>...: one line of Markdown, the arguments joined with spaces.
          paragraph() { echo "$*"; }
          {
            paragraph "The Praenora runtime, version $VERSION, built from $GITHUB_SHA."
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            jq -r '.result | ["Runtime", .runtime], ["Module SDK", .sdk],
                   ["Praenora Module Protocol (PMP)", .pmp],
                   ["Module ABI", "\(.abi.major).\(.abi.minor)"] | "| " + join(" | ") + " |"' \
                "$RUNNER_TEMP/version.json"
            echo
            echo "| Service provider | Version | Services | Engine |"
            echo "|---|---|---|---|"
            jq -r '.result[] | [.name, .version,
                   ([.services[] | "\(.name)@\(.major).\(.minor)"] | join(", ")),
                   "\(.engine.name // "-") \(.engine.version // "")"] | "| " + join(" | ") + " |"' \
                "$RUNNER_TEMP/providers.json"
            echo
            paragraph "Built against the dependency bundles of" \
                "[praenora-runtime-deps $DEPS_VERSION]($deps)." \
                "Each archive has a \`.sha256\` file beside it. Checking, unpacking and running" \
                "an archive: [docs/user-guide.md]($docs/user-guide.md#getting-the-tool)."
            echo
            paragraph "This repository's files are under the MIT license. The runtime and the" \
                "service providers \`roadrunner\` and \`antimony\` in the archives hold" \
                "third-party code, linked statically or compiled in from its headers, which keeps" \
                "its own licenses: in the runtime, yaml-cpp, spdlog with the fmt library it" \
                "bundles, jsoncons and nlohmann/json; in the providers," \
                "libRoadRunner with LLVM, libSBML and libroadrunner-deps' other libraries, and" \
                "libAntimony. Each archive holds their license files in" \
                "\`share/praenora/licenses/\`" \
                "([docs/developer-guide.md]($docs/developer-guide.md#license-files)). The terms" \
                "of the NLEQ1 and NLEQ2 solvers that libRoadRunner links are an open question" \
                "([docs/open-questions.md]($docs/open-questions.md), OQ-27)."
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::A release v$VERSION exists already"
            exit 1
          fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
              --title "praenora-runtime $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
              dist/*
